name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - 'workers/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      # 部品（uses: の行。ほかの人が作り、GitHub で公開しているプログラム）は、コミットの番号で固定しています。
      # 版の名前（@v4 など）で指すと、部品の作り手のアカウントが乗っ取られた時に、乗っ取った人が部品の中身を差し替えて、
      # この設定が使う秘密の値を盗めるためです。版を上げる時は、新しい版のコミットの番号を調べて書き換えます。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd   # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: workers
      - name: Set RESEND_API_KEY secret
        working-directory: workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: echo "$RESEND_API_KEY" | npx wrangler@3.90.0 secret put RESEND_API_KEY
      - name: Set TURNSTILE_SECRET_KEY secret
        working-directory: workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: echo "$TURNSTILE_SECRET_KEY" | npx wrangler@3.90.0 secret put TURNSTILE_SECRET_KEY
